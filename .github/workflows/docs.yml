name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  GO_VERSION: "1.26.10"

permissions:
  contents: write

jobs:
  generate-docs:
    name: Generate Docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Check out the PR head branch (not the merge ref) so generated-doc
          # changes can be committed straight back onto it.
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: Update generated docs
        run: ./generate-docs.sh
      - name: Commit changes
        # Only commits & pushes when generate-docs.sh produced a diff.
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
        with:
          author_name: update generated docs action
          author_email: mail@example.com
          message: "Update docs"
          add: "docs/*"
