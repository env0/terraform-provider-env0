name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  GO_VERSION: "1.26.10"

permissions:
  contents: write

jobs:
  generate-docs:
    name: Generate Docs
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Check out the PR head branch (not the merge ref) so generated-doc
          # changes can be committed straight back onto it.
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Update generated docs
        run: ./generate-docs.sh
      - name: Commit changes
        # Only commits & pushes when generate-docs.sh produced a diff.
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11
        with:
          author_name: update generated docs action
          author_email: mail@example.com
          message: "Update docs"
          add: "docs/*"
