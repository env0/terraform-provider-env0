name: "Validation"
on:
  pull_request:
    types:
      - "opened"
      - "edited"
      - "reopened"

permissions:
  contents: read

jobs:
  check-commit-message:
    name: "PR Title"
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Check Title
        uses: gsactions/commit-message-checker@16fa2d5de096ae0d35626443bcd24f1e756cafee # v2.0.0
        with:
          pattern: '^(feat|fix|chore)(\([^)]+\))?!?: [A-Z].*$'
          error: 'PR title must start with "feat: ", "fix: " or "chore: " followed by an uppercase letter.'
          excludeDescription: true
