name: "Validation"
on:
  pull_request:
    types:
      - "opened"
      - "edited"
      - "reopened"

permissions:
  contents: read

jobs:
  check-commit-message:
    name: "PR Title"
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Check Title
        uses: gsactions/commit-message-checker@v2
        with:
          pattern: '^(feat|fix|chore)(\([^)]+\))?!?: [A-Z].*$'
          error: 'PR title must start with "feat: ", "fix: " or "chore: " followed by an uppercase letter.'
          excludeDescription: true
