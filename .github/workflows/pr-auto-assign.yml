name: 'Auto Assign PR to author'
on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  add-assignee:
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - uses: kentaro-m/auto-assign-action@0a2c53d3721e4c5cfcce6afd4014aecc337979f6 # v2.0.2
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
